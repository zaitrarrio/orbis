[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visko-orbis"
version = "1.0.0"
description = "Live Model reference implementation for real-time interactive long video generation, targeting Linux NVIDIA GPU (CUDA 12.8) on Docker, RunPod, and Vast."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Orbis reference implementation" }]
dependencies = [
  "numpy>=1.23,<2",
  # CUDA 12.8 wheels: Ada (4090), Blackwell (5090), Hopper (H100)
  "torch>=2.7.0",
]

[project.optional-dependencies]
wan = [
  "diffusers>=0.32.0",
  "transformers>=4.45.0",
  "accelerate>=1.0.0",
  "imageio>=2.34.0",
  "imageio-ffmpeg>=0.5.0",
  # UMT5 tokenizer used by the real Wan2.1 text encoder (--real-wan path).
  "sentencepiece>=0.2.0",
]

[project.scripts]
orbis = "orbis.cli:main"

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["orbis"]

[tool.uv]
# Linux x86_64 only — Docker / RunPod / Vast GPU hosts
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
