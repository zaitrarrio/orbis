[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visko-orbis"
version = "1.0.0"
description = "A faithful, CPU-runnable reference implementation of the Visko Orbis Live Model for real-time interactive long video generation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Orbis reference implementation" }]
dependencies = ["numpy>=1.23", "torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
orbis = "orbis.cli:main"

[tool.setuptools.packages.find]
include = ["orbis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
